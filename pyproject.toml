[project]
name = "finance-tools"
version = "0.1.0"
description = "Command-line tools for portfolio planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
finance-tools = "finance_tools.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_tools"]
